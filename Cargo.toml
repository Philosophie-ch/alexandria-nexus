[package]
name = "alexandria-nexus"
version = "0.1.0"
edition = "2024"
authors = ["Luis Alejandro Bordo García <alebg@protonmail.com>"]
description = "Bibliography and knowledge engine for Philosophie.ch"
license = "PolyForm-Noncommercial-1.0.0"
keywords = ["bibliography", "philosophy", "catalog", "api"]
categories = ["web-programming::http-server", "database"]
rust-version = "1.94"

[dependencies]
# For release: use the git tag
hexforge = { git = "ssh://git@gitlab.com/alebg/hexforge.git", tag = "v0.4.0", features = ["axum", "postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
csv = "1.3"
zip = "2"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = "0.1"

# Code generator (used via: cargo run --bin generate)
hexforge-cli = { git = "ssh://git@gitlab.com/alebg/hexforge.git", tag = "v0.4.0" }

[[bin]]
name = "generate"
path = "tools/generate.rs"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
uuid = { version = "1", features = ["v4"] }
testcontainers = "0.26"
testcontainers-modules = { version = "0.14", features = ["postgres"] }

[lints.clippy]
all = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
redundant_clone = "warn"

[lints.rust]
warnings = "deny"

# DEV ONLY: uncomment to use local hexforge instead of git.
# Comment out before committing.
# [patch."ssh://git@gitlab.com/alebg/hexforge.git"]
# hexforge = { path = "../../../GitRepos/hexforge" }
# hexforge-cli = { path = "../../../GitRepos/hexforge/hexforge-cli" }
