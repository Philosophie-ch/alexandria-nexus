# hexforge.yml — Alexandria Nexus schema
# Bibliography and knowledge engine for Philosophie.ch

project:
  name: "alexandria-nexus"
  description: "Bibliography and knowledge engine for Philosophie.ch"
  api_prefix: "/api/v1"

# =============================================================================
# ENUMS
# =============================================================================

enums:
  EntryType:
    db_name: "entry_type"
    rename_all: "lowercase"
    default: "Unknown"
    variants:
      - Article
      - Book
      - Incollection
      - Inproceedings
      - Mastersthesis
      - Misc
      - Phdthesis
      - Proceedings
      - Techreport
      - Unpublished
      - { name: Unknown, rename: "UNKNOWN" }

  PubState:
    db_name: "pubstate"
    rename_all: "lowercase"
    variants:
      - Unpub
      - Forthcoming
      - Inwork
      - Submitted
      - Published

  LangId:
    db_name: "langid"
    rename_all: "lowercase"
    variants:
      - Catalan
      - Czech
      - Danish
      - Dutch
      - English
      - French
      - Greek
      - Italian
      - Latin
      - Lithuanian
      - Ngerman
      - Polish
      - Portuguese
      - Romanian
      - Russian
      - Slovak
      - Spanish
      - Swedish
      - Unknown

  Epoch:
    db_name: "epoch"
    rename_all: "kebab-case"
    variants:
      - AncientPhilosophy
      - AncientScientists
      - AustrianPhilosophy
      - BritishIdealism
      - Classics
      - Contemporaries
      - ContemporaryScientists
      - ContinentalPhilosophy
      - CriticalTheory
      - Cynics
      - Enlightenment
      - Existentialism
      - ExoticPhilosophy
      - GermanIdealism
      - GermanRationalism
      - GestaltPsychology
      - Hermeneutics
      - IslamicPhilosophy
      - Mathematicians
      - MedievalPhilosophy
      - ModernPhilosophy
      - ModernScientists
      - NeoKantianism
      - Neoplatonism
      - NewRealism
      - OrdinaryLanguagePhilosophy
      - Phenomenology
      - PolishLogic
      - Pragmatism
      - Presocratics
      - Renaissance
      - Stoics
      - Theologians
      - ViennaCircle

  AuthorRole:
    db_name: "author_role"
    rename_all: "lowercase"
    default: "Author"
    extra_derives: [Hash]
    variants:
      - Author
      - Editor
      - Guesteditor

  RefType:
    db_name: "ref_type"
    rename_all: "snake_case"
    variants:
      - FurtherRef
      - DependsOn

  PermissionLevel:
    db_name: "permission_level"
    rename_all: "lowercase"
    default: "Read"
    variants:
      - Public
      - Read
      - Write
      - Admin

# =============================================================================
# CUSTOM TYPES
# =============================================================================

custom_types:
  bib_string:
    expands_to:
      - { suffix: "_latex", type: "Option<String>" }
      - { suffix: "_unicode", type: "Option<String>" }

# =============================================================================
# MODELS
# =============================================================================

models:
  # ---------------------------------------------------------------------------
  # Author
  # ---------------------------------------------------------------------------
  Author:
    table: "authors"
    key_field: "author_key"
    fields:
      author_key: { type: string, required: true, unique: true }
      given_name: { type: bib_string }
      family_name: { type: bib_string }
      mononym: { type: bib_string }
      shorthand: { type: bib_string }
      famous_name: { type: bib_string }
      name_variants_latex: { type: "string[]?" }
      name_variants_unicode: { type: "string[]?" }
    constraints:
      - either: [family_name_latex, mononym_latex]
    filters:
      family_name: { op: like, column: "family_name_unicode" }
      search_term: { op: like_any, columns: "family_name_unicode,given_name_unicode" }
    indexes:
      - { columns: [family_name_unicode] }
      - { columns: [family_name_unicode, given_name_unicode] }
      - { columns: [family_name_unicode], type: gin_trgm }
      - { columns: [name_variants_latex], type: gin }
      - { columns: [name_variants_unicode], type: gin }
      - { columns: [given_name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # Journal
  # ---------------------------------------------------------------------------
  Journal:
    table: "journals"
    key_field: "journal_key"
    fields:
      journal_key: { type: string, required: true, unique: true }
      name_latex: { type: string, required: true, unique: true }
      name_unicode: { type: string, required: true }
      issn_print: { type: "string?" }
      issn_electronic: { type: "string?" }
    filters:
      name: { op: like, column: "name_unicode" }
    indexes:
      - { columns: [name_unicode] }
      - { columns: [name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # Publisher
  # ---------------------------------------------------------------------------
  Publisher:
    table: "publishers"
    key_field: "publisher_key"
    fields:
      publisher_key: { type: string, required: true, unique: true }
      name_latex: { type: string, required: true, unique: true }
      name_unicode: { type: string, required: true }
      default_address: { type: "string?" }
    filters:
      name: { op: like, column: "name_unicode" }
    indexes:
      - { columns: [name_unicode] }
      - { columns: [name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # Institution
  # ---------------------------------------------------------------------------
  Institution:
    table: "institutions"
    key_field: "institution_key"
    fields:
      institution_key: { type: string, required: true, unique: true }
      name_latex: { type: string, required: true, unique: true }
      name_unicode: { type: string, required: true }
      default_address: { type: "string?" }
    filters:
      name: { op: like, column: "name_unicode" }
    indexes:
      - { columns: [name_unicode] }
      - { columns: [name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # School
  # ---------------------------------------------------------------------------
  School:
    table: "schools"
    key_field: "school_key"
    fields:
      school_key: { type: string, required: true, unique: true }
      name_latex: { type: string, required: true, unique: true }
      name_unicode: { type: string, required: true }
    filters:
      name: { op: like, column: "name_unicode" }
    indexes:
      - { columns: [name_unicode] }
      - { columns: [name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # Series
  # ---------------------------------------------------------------------------
  Series:
    table: "series"
    key_field: "series_key"
    fields:
      series_key: { type: string, required: true, unique: true }
      name_latex: { type: string, required: true, unique: true }
      name_unicode: { type: string, required: true }
    filters:
      name: { op: like, column: "name_unicode" }
    indexes:
      - { columns: [name_unicode] }
      - { columns: [name_unicode], type: gin_trgm }

  # ---------------------------------------------------------------------------
  # Keyword
  # ---------------------------------------------------------------------------
  Keyword:
    table: "keywords"
    fields:
      name: { type: string, required: true }
      level: { type: i16, required: true, check_range: [1, 3] }
    filters:
      level: { op: eq, column: "level" }
      name: { op: like, column: "name" }
    indexes:
      - { columns: [level] }
      - { columns: [name] }

  # ---------------------------------------------------------------------------
  # BibItem
  # ---------------------------------------------------------------------------
  BibItem:
    table: "bibitems"
    key_field: "bibkey"
    file_name: "bibitem"
    fields:
      # Identity
      bibkey: { type: string, required: true, unique: true }
      entry_type: { type: EntryType, required: true }

      # Dates
      date_year: { type: "i16?" }
      date_year_2_hyphen: { type: "i16?" }
      date_year_2_slash: { type: "i16?" }
      date_month: { type: "i16?" }
      date_day: { type: "i16?" }
      date_is_no_date: { type: bool }
      pubstate: { type: "PubState?" }

      # Title (required bib_string)
      title: { type: bib_string, required: true }

      # Booktitle (optional bib_string)
      booktitle: { type: bib_string }

      # Publication info
      journal_id: { type: "i64?" }
      publisher_id: { type: "i64?" }
      address: { type: "string?" }
      volume: { type: "string?" }
      number: { type: "string?" }
      pages: { type: "string?" }
      eid: { type: "string?" }
      series_id: { type: "i64?" }
      edition: { type: "string?" }

      # Institutional
      institution_id: { type: "i64?" }
      school_id: { type: "i64?" }
      type_field: { type: "string?" }

      # Identifiers
      doi: { type: "string?" }
      url: { type: "string?" }
      eprint: { type: "string?" }
      urn: { type: "string?" }

      # References
      crossref_id: { type: "i64?" }

      # Issue/notes
      issuetitle_latex: { type: "string?" }
      issuetitle_unicode: { type: "string?" }
      note_latex: { type: "string?" }
      note_unicode: { type: "string?" }
      extra_note_latex: { type: "string?" }
      extra_note_unicode: { type: "string?" }

      # Metadata
      langid: { type: "LangId?" }
      is_translation: { type: bool }
      epoch: { type: "Epoch?" }
      options: { type: "string?" }
      shorthand: { type: "string?" }

      # Internal tracking
      person_id: { type: "i64?" }
      has_fulltext: { type: bool }
      fulltext_path: { type: "string?" }

    relations:
      journal:
        type: belongs_to
        fk: journal_id
        target: Journal
      publisher:
        type: belongs_to
        fk: publisher_id
        target: Publisher
      institution:
        type: belongs_to
        fk: institution_id
        target: Institution
      school:
        type: belongs_to
        fk: school_id
        target: School
      series:
        type: belongs_to
        fk: series_id
        target: Series
      crossref:
        type: belongs_to
        fk: crossref_id
        target: BibItem
      person:
        type: belongs_to
        fk: person_id
        target: Author
      authors:
        type: many_to_many
        through: bibitem_authors
        local_fk: bibitem_id
        foreign_fk: author_id
        target: Author
        extra_columns:
          - { name: role, type: "AuthorRole", default: "'author'", primary_key: true }
          - { name: position, type: "i16" }
          - { name: name_variant_latex, type: "string?" }
          - { name: name_variant_unicode, type: "string?" }
      keywords:
        type: many_to_many
        through: bibitem_keywords
        local_fk: bibitem_id
        foreign_fk: keyword_id
        target: Keyword
        extra_columns:
          - { name: keyword_level, type: "i16" }
      refs:
        type: many_to_many
        through: bibitem_refs
        local_fk: source_id
        foreign_fk: target_id
        target: BibItem
        extra_columns:
          - { name: ref_type, type: "RefType", primary_key: true }

    filters:
      entry_type: { op: eq_cast, column: "entry_type::entry_type" }
      year_from: { op: gte, column: "date_year" }
      year_to: { op: lte, column: "date_year" }
      author_id: { op: raw, sql: "id IN (SELECT bibitem_id FROM bibitem_authors WHERE author_id = $)" }
      journal_id: { op: eq, column: "journal_id" }
      epoch: { op: eq_cast, column: "epoch::epoch" }
      search_term: { op: like, column: "title_unicode" }

    indexes:
      - { columns: [entry_type] }
      - { columns: [date_year] }
      - { columns: [journal_id] }
      - { columns: [publisher_id] }
      - { columns: [crossref_id] }
      - { columns: [title_unicode], type: gin_trgm }
      - { columns: [bibkey], type: gin_trgm }

    projections:
      summary:
        - bibkey
        - entry_type
        - title_unicode
        - date_year
        - pubstate

    expand:
      journal:
        type: fk
        fk: journal_id
        target: Journal
        projection: [journal_key, name_unicode]
      publisher:
        type: fk
        fk: publisher_id
        target: Publisher
        projection: [publisher_key, name_unicode]
      institution:
        type: fk
        fk: institution_id
        target: Institution
        projection: [institution_key, name_unicode]
      school:
        type: fk
        fk: school_id
        target: School
        projection: [school_key, name_unicode]
      series:
        type: fk
        fk: series_id
        target: Series
        projection: [series_key, name_unicode]
      crossref:
        type: fk
        fk: crossref_id
        target: BibItem
        projection: [bibkey, entry_type, title_unicode, date_year]
      authors:
        type: junction
        through: bibitem_authors
        filter: "role = 'author'"
        target: Author
        projection: [author_key, given_name_unicode, family_name_unicode, mononym_unicode]
      editors:
        type: junction
        through: bibitem_authors
        filter: "role = 'editor'"
        target: Author
        projection: [author_key, given_name_unicode, family_name_unicode, mononym_unicode]
      guesteditors:
        type: junction
        through: bibitem_authors
        filter: "role = 'guesteditor'"
        target: Author
        projection: [author_key, given_name_unicode, family_name_unicode, mononym_unicode]
      keywords:
        type: junction
        through: bibitem_keywords
        target: Keyword
        projection: [name, level]

  # ---------------------------------------------------------------------------
  # ApiKey (authentication table)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # BibitemNotes (1:1 extension for internal workflow notes)
  # ---------------------------------------------------------------------------
  BibitemNotes:
    table: "bibitem_notes"
    fields:
      bibitem_id: { type: "i64", required: true, unique: true }
      notes: { type: "jsonb", required: true }
    relations:
      bibitem:
        type: belongs_to
        fk: bibitem_id
        target: BibItem

  # ---------------------------------------------------------------------------
  # DataVersion (data version tracking — append-only log)
  # ---------------------------------------------------------------------------
  DataVersion:
    table: "data_version"
    fields:
      version:     { type: string,    required: true }
      description: { type: "string?" }
      imported_at: { type: timestamp, required: true }

  # ---------------------------------------------------------------------------
  # ApiKey (authentication table)
  # ---------------------------------------------------------------------------
  ApiKey:
    table: "api_keys"
    fields:
      key_hash: { type: string, required: true, unique: true }
      name: { type: string, required: true }
      permission: { type: PermissionLevel, required: true }
      revoked_at: { type: "timestamp?" }
    indexes:
      - { columns: [key_hash] }
      - { columns: [key_hash], where: "revoked_at IS NULL" }

# =============================================================================
# OPERATIONS (custom non-CRUD endpoints)
# =============================================================================

operations:
  search:
    method: POST
    path: "/search"
    description: "Full-text search with pg_trgm similarity"
    permission: Read
    fn_name: search_bibitems

  render:
    method: POST
    path: "/render"
    description: "HTML bibliography renderer"
    permission: Public
    fn_name: render_bibitems

  export_authors:
    method: POST
    path: "/admin/export/authors"
    description: "CSV export for authors"
    permission: Admin
    group: export

  export_journals:
    method: POST
    path: "/admin/export/journals"
    description: "CSV export for journals"
    permission: Admin
    group: export

  export_publishers:
    method: POST
    path: "/admin/export/publishers"
    description: "CSV export for publishers"
    permission: Admin
    group: export

  export_institutions:
    method: POST
    path: "/admin/export/institutions"
    description: "CSV export for institutions"
    permission: Admin
    group: export

  export_schools:
    method: POST
    path: "/admin/export/schools"
    description: "CSV export for schools"
    permission: Admin
    group: export

  export_series:
    method: POST
    path: "/admin/export/series"
    description: "CSV export for series"
    permission: Admin
    group: export

  export_keywords:
    method: POST
    path: "/admin/export/keywords"
    description: "CSV export for keywords"
    permission: Admin
    group: export

  export_bibitems:
    method: POST
    path: "/admin/export/bibitems"
    description: "CSV export for bibitems (expanded or IDs format)"
    permission: Admin
    group: export

  import_authors:
    method: POST
    path: "/admin/import/authors"
    description: "CSV import for authors"
    permission: Admin
    group: import

  import_journals:
    method: POST
    path: "/admin/import/journals"
    description: "CSV import for journals"
    permission: Admin
    group: import

  import_publishers:
    method: POST
    path: "/admin/import/publishers"
    description: "CSV import for publishers"
    permission: Admin
    group: import

  import_institutions:
    method: POST
    path: "/admin/import/institutions"
    description: "CSV import for institutions"
    permission: Admin
    group: import

  import_schools:
    method: POST
    path: "/admin/import/schools"
    description: "CSV import for schools"
    permission: Admin
    group: import

  import_series:
    method: POST
    path: "/admin/import/series"
    description: "CSV import for series"
    permission: Admin
    group: import

  import_keywords:
    method: POST
    path: "/admin/import/keywords"
    description: "CSV import for keywords"
    permission: Admin
    group: import

  import_bibitems:
    method: POST
    path: "/admin/import/bibitems"
    description: "CSV import for bibitems with ID references"
    permission: Admin
    group: import

  keyword_tree:
    method: GET
    path: "/keywords/tree"
    description: "Keyword hierarchy organized by level"
    permission: Read
    fn_name: get_keyword_tree

  validate_full_csv:
    method: POST
    path: "/admin/validate-full-csv"
    description: "Validate a human-readable CSV against the database"
    permission: Admin
    group: full_import

  import_entities_from_full_csv:
    method: POST
    path: "/admin/import-entities-from-full-csv"
    description: "Create missing entities from a human-readable CSV"
    permission: Admin
    group: full_import

  import_full_csv:
    method: POST
    path: "/admin/import-full-csv"
    description: "Import bibitems from a human-readable CSV (source of truth)"
    permission: Admin
    group: full_import

  export_full_csv:
    method: POST
    path: "/admin/export-full-csv"
    description: "Export bibitems as human-readable CSV matching the ODS import format"
    permission: Admin
    group: full_import

  wipe:
    method: POST
    path: "/admin/wipe"
    description: "Truncate all data tables in reverse dependency order. Requires ?confirm=true."
    permission: Admin
    fn_name: wipe_data
