name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # hexforge is a private git dep — needs SSH key to fetch
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HEXFORGE_DEPLOY_KEY }}

      # Same derivation as deploy.yml, so build and deploy cannot drift apart
      - name: Resolve image name and version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Note: To make the package private, go to:
      # github.com/orgs/Philosophie-ch/packages → alexandria-nexus → Settings → Visibility → Private

  deploy:
    name: Deploy to production
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
