name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Image version to deploy (e.g. 0.2.11 or v0.2.11)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to deploy (e.g. 0.2.11 or v0.2.11)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Resolve image tag
        id: image
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '${INPUT_VERSION}': expected X.Y.Z or vX.Y.Z"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${REGISTRY}/${GITHUB_REPOSITORY,,}:${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        env:
          ALEXANDRIA_DB_USER: alexandria
          ALEXANDRIA_DB_PASSWORD: ${{ secrets.ALEXANDRIA_DB_PASSWORD }}
          ALEXANDRIA_DB_NAME: alexandria
          ALEXANDRIA_SEED_API_KEY: ${{ secrets.ALEXANDRIA_SEED_API_KEY }}
          ALEXANDRIA_SEED_READ_KEY: ${{ secrets.ALEXANDRIA_SEED_READ_KEY }}
          ALLOWED_ORIGINS: ${{ vars.PROD_ALLOWED_ORIGINS }}
          IMAGE: ${{ steps.image.outputs.tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          capture_stdout: true
          envs: ALEXANDRIA_DB_USER,ALEXANDRIA_DB_PASSWORD,ALEXANDRIA_DB_NAME,ALEXANDRIA_SEED_API_KEY,ALEXANDRIA_SEED_READ_KEY,ALLOWED_ORIGINS,IMAGE,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            # Verify curl is available
            if ! command -v curl >/dev/null 2>&1; then
              echo "curl is not installed on this server — cannot run health check"
              exit 1
            fi

            # Log in to ghcr.io in a throwaway Docker config so the short-lived
            # token never lands in ~/.docker/config.json. The directory is removed
            # on any exit, success or failure.
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            trap 'rm -rf "${DOCKER_CONFIG}"' EXIT
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            # Ensure the private network exists
            docker network inspect private >/dev/null 2>&1 || docker network create --driver bridge private

            # Ensure alexandria-db is running (idempotent — does nothing if already up)
            if ! docker ps --format '{{.Names}}' | grep -q '^alexandria-db$'; then
              echo "Starting alexandria-db..."
              # Remove stopped container if it exists (volume is preserved)
              docker rm alexandria-db 2>/dev/null || true
              docker run -d \
                --name alexandria-db \
                --network private \
                --restart unless-stopped \
                --log-driver json-file \
                --log-opt max-size=50m \
                --log-opt max-file=5 \
                -p 127.0.0.1:5433:5432 \
                -v alexandria_data:/var/lib/postgresql/18/docker \
                -e POSTGRES_USER="${ALEXANDRIA_DB_USER}" \
                -e POSTGRES_PASSWORD="${ALEXANDRIA_DB_PASSWORD}" \
                -e POSTGRES_DB="${ALEXANDRIA_DB_NAME}" \
                postgres:18-alpine

              echo "Waiting for alexandria-db to be ready..."
              for i in $(seq 1 30); do
                if docker exec alexandria-db pg_isready -U "${ALEXANDRIA_DB_USER}" -h 127.0.0.1 >/dev/null 2>&1; then
                  echo "alexandria-db is ready"
                  break
                fi
                sleep 1
              done
            else
              echo "alexandria-db already running"
            fi

            # Pull the requested Alexandria image. A missing tag fails here,
            # before the running container is touched.
            docker pull "${IMAGE}"

            # Restart Alexandria (migrations run automatically on startup)
            docker stop alexandria 2>/dev/null || true
            docker rm alexandria 2>/dev/null || true
            docker run -d \
              --name alexandria \
              --network private \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=5 \
              -p 127.0.0.1:8080:8080 \
              -e DATABASE_URL="postgres://${ALEXANDRIA_DB_USER}:${ALEXANDRIA_DB_PASSWORD}@alexandria-db:5432/${ALEXANDRIA_DB_NAME}" \
              -e HOST=0.0.0.0 \
              -e PORT=8080 \
              -e ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
              -e RUST_LOG=alexandria_nexus=info,tower_http=info \
              -e SEED_API_KEY="${ALEXANDRIA_SEED_API_KEY}" \
              -e SEED_API_KEY_NAME="Admin Key" \
              -e SEED_READ_KEY="${ALEXANDRIA_SEED_READ_KEY}" \
              -e SEED_READ_KEY_NAME="Portal Read Key" \
              "${IMAGE}"

            # Wait for health check
            echo "Waiting for Alexandria to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "Alexandria is healthy"
                running_image="$(docker inspect alexandria --format '{{.Config.Image}}')"
                running_digest="$(docker image inspect "${running_image}" --format '{{index .RepoDigests 0}}')"
                echo "RUNNING ${running_image} ${running_digest}"
                exit 0
              fi
              sleep 1
            done
            echo "Alexandria failed health check after 30s"
            docker logs alexandria --tail 20
            exit 1

      - name: Report deployed version
        env:
          DEPLOY_STDOUT: ${{ steps.deploy.outputs.stdout }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          running="$(grep '^RUNNING ' <<< "${DEPLOY_STDOUT}" | tail -n 1 | cut -d' ' -f2-)"
          {
            echo "### Deployed Alexandria ${VERSION}"
            echo
            echo "Running: \`${running}\`"
          } >> "$GITHUB_STEP_SUMMARY"
