services:
  alexandria-db:
    container_name: alexandria-db
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    depends_on:
      - alexandria-db

  app:
    container_name: alexandria-nexus
    build:
      context: .
      ssh:
        - default
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@alexandria-db:5432/${POSTGRES_DB}
    depends_on:
      alexandria-db:
        condition: service_healthy

volumes:
  postgres_data:
